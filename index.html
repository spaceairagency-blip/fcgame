<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbE--3ElcEOlzjtuD2odRS0ipX-MedMlAzN7kRJpsqpQ&s=10">
<meta property="og:title" content="Penalty Kick Champions">
<title>Penalty Kick Champions ⚽</title>
<style>
:root{--bg:#0f1b14;--fg:#f4fff6;--accent:#ffd400;--card:#173324;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b14;--fg:#f4fff6;--card:#173324}}
:root[data-theme="dark"]{--bg:#0f1b14;--fg:#f4fff6;--card:#173324}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
h1{margin:16px 8px 4px;font-size:clamp(1.3rem,4vw,2rem)}
.sub{margin:0 8px 10px;opacity:.75;font-size:.9rem}
.wrap{position:relative;max-width:720px;margin:0 auto;padding:0 10px}
canvas{width:100%;height:auto;border-radius:14px;background:#2e8b3d;display:block;touch-action:none;box-shadow:0 8px 30px #0008}
.hud{display:flex;justify-content:space-between;max-width:720px;margin:8px auto;padding:0 14px;font-weight:700}
#overlay{position:absolute;inset:0 10px;border-radius:14px;overflow:hidden;background:linear-gradient(#0008,#000d),url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbE--3ElcEOlzjtuD2odRS0ipX-MedMlAzN7kRJpsqpQ&s=10") center/cover,#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#play{font-size:1.5rem;font-weight:800;padding:16px 44px;border:0;border-radius:999px;background:var(--accent);color:#111;cursor:pointer;box-shadow:0 6px 0 #b39500;transition:transform .1s}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #b39500}
#grid{position:fixed;inset:0;z-index:10;background:#000;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 8px calc(env(safe-area-inset-bottom,0px) + 10px)}
#grid.on{display:block}
#grid.prep{display:block;opacity:0;pointer-events:none}
#loader{display:none;width:min(80%,420px)}
#track{height:14px;border-radius:99px;background:#fff3;overflow:hidden}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd400,#ff7a00)}
#status{margin-top:8px;font-size:.9rem}
#bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#bar b{color:var(--accent)}
#bar button,#bar a{background:var(--accent);color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.9rem}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#7b2ff7,#f107a3);border-radius:8px;overflow:hidden;opacity:0;transform:scale(.6);animation:pop .25s forwards;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800}
.tile .dance{font-size:2.6rem;animation:bounce .5s infinite alternate}
.tile small{font-size:.75rem;opacity:.9}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.tile video.ready{opacity:1}
@keyframes bounce{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-10px) rotate(8deg)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<h1>⚽ Penalty Kick Champions</h1>
<p class="sub">Click / tap anywhere on the pitch to shoot. Beat the keeper!</p>
<div class="hud"><span>Goals: <span id="goals">0</span></span><span>Shots: <span id="shots">0</span></span></div>
<div class="wrap">
  <canvas id="c" width="720" height="440"></canvas>
  <div id="overlay">
    <div style="font-size:3rem">🏆⚽🥅</div>
    <div>World Cup Final · Penalty Shootout</div>
    <button id="play">▶ PLAY</button>
    <div id="loader"><div id="track"><div id="fill"></div></div><div id="status">Loading game… 0%</div></div>
  </div>
</div>

<div id="grid">
  <div id="bar">
    <b>🎵 You just got rickrolled 🎵</b>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">Open on YouTube</a>
    <button id="more">+ More</button>
    <button id="back">Back to game</button>
  </div>
  <div id="tiles"></div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let running=false,goals=0,shots=0;
const ball={x:W/2,y:H-70,vx:0,vy:0,r:11,moving:false};
const keeper={x:W/2,w:70,dir:1,speed:3};
const goal={x:W/2-110,y:50,w:220,h:90};

function resetBall(){ball.x=W/2;ball.y=H-70;ball.vx=ball.vy=0;ball.moving=false}
function shoot(px,py){
  if(!running||ball.moving)return;
  const dx=px-ball.x,dy=py-ball.y,d=Math.hypot(dx,dy)||1;
  ball.vx=dx/d*13;ball.vy=dy/d*13;ball.moving=true;shots++;
  document.getElementById('shots').textContent=shots;
}
function pos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return[(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height];
}
cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e);shoot(x,y)});

function update(){
  keeper.x+=keeper.dir*keeper.speed;
  if(keeper.x<goal.x+keeper.w/2||keeper.x>goal.x+goal.w-keeper.w/2){keeper.dir*=-1}
  if(ball.moving){
    ball.x+=ball.vx;ball.y+=ball.vy;
    const kTop=goal.y+goal.h-30;
    if(ball.y<goal.y+goal.h&&ball.y>goal.y-10&&Math.abs(ball.x-keeper.x)<keeper.w/2+ball.r&&ball.y>kTop-20){
      msg('🧤 SAVED!');resetBall();return;
    }
    if(ball.y<goal.y+20){
      if(ball.x>goal.x&&ball.x<goal.x+goal.w){goals++;document.getElementById('goals').textContent=goals;msg('⚽ GOOOAL!');
        keeper.speed=Math.min(7,keeper.speed+.3)}
      else msg('😬 Wide!');
      resetBall();
    }
    if(ball.x<0||ball.x>W||ball.y<0||ball.y>H){msg('😬 Miss!');resetBall()}
  }
}
let text='',textT=0;
function msg(t){text=t;textT=60}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#2e8b3d':'#33a044';ctx.fillRect(0,i*H/8,W,H/8)}
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.strokeRect(W/2-190,goal.y,380,170);
  ctx.beginPath();ctx.arc(W/2,H-70,5,0,7);ctx.fillStyle='#fff';ctx.fill();
  // goal
  ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeRect(goal.x,goal.y,goal.w,goal.h);
  ctx.lineWidth=1;ctx.strokeStyle='#fff6';
  for(let x=goal.x;x<=goal.x+goal.w;x+=14){ctx.beginPath();ctx.moveTo(x,goal.y);ctx.lineTo(x,goal.y+goal.h);ctx.stroke()}
  for(let y=goal.y;y<=goal.y+goal.h;y+=14){ctx.beginPath();ctx.moveTo(goal.x,y);ctx.lineTo(goal.x+goal.w,y);ctx.stroke()}
  // keeper
  ctx.fillStyle='#ff5a1f';ctx.fillRect(keeper.x-keeper.w/2,goal.y+goal.h-52,keeper.w,40);
  ctx.beginPath();ctx.arc(keeper.x,goal.y+goal.h-60,12,0,7);ctx.fillStyle='#f1c27d';ctx.fill();
  // striker
  ctx.fillStyle='#1e66ff';ctx.fillRect(W/2-14,H-48,28,34);
  ctx.beginPath();ctx.arc(W/2,H-56,10,0,7);ctx.fillStyle='#f1c27d';ctx.fill();
  // ball
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.stroke();
  if(textT>0){textT--;ctx.font='bold 40px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffd400';ctx.strokeStyle='#000';ctx.lineWidth=5;
    ctx.strokeText(text,W/2,H/2);ctx.fillText(text,W/2,H/2)}
}
function loop(){if(running)update();draw();requestAnimationFrame(loop)}
loop();

// Rickroll grid
const tiles=document.getElementById('tiles'),grid=document.getElementById('grid');
const VIDEO='https://fcgame26.vercel.app/rol.mp4',TOTAL=12;
let count=0,ready=0,dl=0,srcURL=null;

// Download the mp4 ONCE (starts as soon as the page opens) and reuse it for every tile
const blobP=(async()=>{
  try{
    const r=await fetch(VIDEO);if(!r.ok)throw 0;
    const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),chunks=[];let got=0;
    for(;;){const x=await rd.read();if(x.done)break;chunks.push(x.value);got+=x.value.length;
      dl=total?got/total:Math.min(.95,dl+.03)}
    srcURL=URL.createObjectURL(new Blob(chunks,{type:r.headers.get('content-type')||'video/mp4'}));
  }catch(e){srcURL=VIDEO}   // fallback: load directly
  dl=1;
})();

function addTiles(n){
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='tile';
    d.style.animationDelay=(i*0.05)+'s';
    d.innerHTML='<div class="dance">🕺</div><small>🎵 Rickrolled 🎵</small>';
    const v=document.createElement('video');
    v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='auto';
    v.setAttribute('playsinline','');v.setAttribute('muted','');
    let counted=false;
    v.addEventListener('canplay',()=>{v.classList.add('ready');v.play().catch(()=>{})});
    v.addEventListener('canplaythrough',()=>{if(!counted){counted=true;ready++}});
    v.src=srcURL;
    d.appendChild(v);tiles.appendChild(d);count++;
  }
}
const steps=['Loading stadium…','Warming up the pitch…','Connecting to server…','Almost ready…'];
document.getElementById('play').onclick=function(){
  this.style.display='none';
  document.getElementById('loader').style.display='block';
  running=true;tiles.innerHTML='';count=0;ready=0;
  grid.classList.add('prep');            // invisible while videos get ready
  blobP.then(()=>addTiles(TOTAL));
  const fill=document.getElementById('fill'),status=document.getElementById('status');
  const t0=performance.now();
  (function tick(){
    const el=performance.now()-t0;
    const done=(count===TOTAL&&ready>=TOTAL&&el>=1200)||el>=30000;  // wait for ALL videos
    const p=done?100:Math.min(99,dl*70+(count?ready/TOTAL*30:0));
    fill.style.width=p+'%';
    status.textContent=steps[Math.min(3,Math.floor(p/26))]+' '+Math.floor(p)+'%';
    if(done){setTimeout(reveal,200);return}
    requestAnimationFrame(tick);
  })();
};
function reveal(){
  document.getElementById('overlay').style.display='none';
  grid.classList.remove('prep');grid.classList.add('on');
  tiles.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}));
}
document.getElementById('more').onclick=()=>addTiles(6);
document.getElementById('back').onclick=()=>{grid.classList.remove('on');tiles.innerHTML=''};
</script>
</body>
</html>
